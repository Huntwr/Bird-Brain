<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bird Brain - Comment Page</title>
</head>
<body>

    <div class="container">
        <!-- Top section -->
        <div class="post-info-container">
            <div class="post-picture">Picture From Post</div>
            <div class="bird-info">Bird Info</div>
        </div>

        <!-- Comment section TEST -->
        <div class="comment-section">
            <h3>Comment Here</h3>
            <form class="comment-form">
                <textarea placeholder="Write your comment..."></textarea>
                <button type="submit">Post Comment</button>
            </form>

            <!-- Sample comments -->
            <div class="comment-list">
                <div class="comment">
                    <div class="pfp"></div>
                    <div class="comment-content">
                        <span class="comment-username">User1 writes:</span>
                        <p class="comment-text">This is a placeholder comment.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
