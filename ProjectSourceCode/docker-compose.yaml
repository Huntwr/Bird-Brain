version: '3.8'

services:
  db:
    image: postgres:14
    env_file: .env
    ports:
      - '5432:5432'
    volumes:
      - group-project-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  web:
    build: .
    env_file: .env
    depends_on:
      - db
    ports:
      - '3000:3000'
   # volumes:
    #  - .:/usr/src/app
    command: 'npm start'

volumes:
  group-project-data:

#note that I had to comment out volumes 