 <!doctype html>

<html lang="en">

<head>

  <meta charset="utf-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Bird Sighting</title>

  <link

    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"

    rel="stylesheet"

  />


  <link

    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"

    rel="stylesheet"

  />
  <style>


    .upload-drop {

      position: relative;

      border: 2px dashed var(--bs-border-color);

      border-radius: var(--bs-border-radius-lg);

      min-height: 360px;

      display: grid;

      place-items: center;

      text-align: center;

      padding: 1rem;

      transition: border-color .15s ease-in-out, background .15s ease-in-out;

      background: var(--bs-body-bg);

    }

    .upload-drop.dragover {

      border-color: var(--bs-primary);

      background: rgba(var(--bs-primary-rgb), .05);

    }

    .upload-input {

      position: absolute;

      inset: 0;

      opacity: 0;

      cursor: pointer;

    }

    .upload-preview {

      display: none;

      max-width: 100%;

      max-height: 100%;

      border-radius: var(--bs-border-radius);

      object-fit: contain;

    }

    .upload-empty {

      color: var(--bs-secondary-color);

    }

  </style>

</head>

<body class="bg-body-tertiary">

  <div class="container py-5">

    <h1 class="h3 mb-4">Log a Bird Sighting</h1>



    <form class="needs-validation" novalidate>

      <div class="row g-4">

        <!-- LEFT: Fields -->

        <div class="col-lg-6">

          <div class="mb-3">

            <label for="bird" class="form-label">Bird <span class="text-danger">*</span></label>

            <input type="text" class="form-control" id="bird" name="bird" placeholder="e.g., American Robin" required />

            <div class="invalid-feedback">Please enter the bird name.</div>

          </div>



          <div class="mb-3">

            <label for="location" class="form-label">Location</label>

            <input type="text" class="form-control" id="location" name="location" placeholder="e.g., Chautauqua Park, Boulder, CO" />

          </div>



          <div class="mb-3">

            <label for="time" class="form-label">Time</label>

            <input type="datetime-local" class="form-control" id="time" name="time" />

          </div>



          <div class="mb-3">

            <label for="description" class="form-label">Description</label>

            <textarea class="form-control" id="description" name="description" rows="7"

              placeholder="Notes about behavior, weather, call, etc."></textarea>

          </div>

        </div>
        <div class="col-lg-6">

          <label class="form-label d-flex justify-content-between align-items-center">

            <span>Upload Picture <span class="text-danger">(required)</span></span>

          </label>



          <div id="uploadZone" class="upload-drop">

            <input id="photo" class="upload-input" type="file" name="photo" accept="image/*" required />

            <img id="preview" class="upload-preview" alt="Preview" />

            <div id="emptyState" class="upload-empty">

              <div class="display-6"><i class="bi bi-plus-lg"></i></div>

              <div class="mt-2">Click or drag a photo here</div>

              <small class="text-secondary d-block mt-1">PNG/JPG up to ~10MB</small>

            </div>

          </div>

          <div class="invalid-feedback d-block" id="photoInvalid" style="display:none;">

            Please upload a picture.

          </div>

        </div>

      </div>
      <hr class="my-4" />

      <div class="d-flex gap-2">

        <button class="btn btn-primary" type="submit">Submit</button>

        <button class="btn btn-outline-secondary" type="reset">Reset</button>

      </div>

    </form>

  </div>

</body>

</html>
