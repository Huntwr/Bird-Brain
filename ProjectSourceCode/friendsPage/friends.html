<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bird Brain - Friends</title>
    <link rel="stylesheet" href="../commentPage/commentStyle.css">
    <link rel="stylesheet" href="../shared/navbarStyle.css">
    <link rel="stylesheet" href="friendsStyle.css">
</head>
<body>
    <div class="container">
        <div class="friends-tabs">
            <button class="tab active">Friends (#)</button>
            <button class="tab">Favorites (#)</button>
            <button class="tab">Requests (#)</button>
            <button class="tab">Invite</button>
        </div>

        <div class="content-area">
            <div class="friends-list">
                <div class="friend-item">Friend 1</div>
                <div class="friend-item">Friend 2</div>
                <div class="friend-item">Friend 3</div>
                <div class="friend-item">Friend 4</div>
            </div>

            <div class="posts-section">
                <div class="posts-header">
                    <h3>Friend Name</h3>
                    <div>
                        <span>Posts (#)</span>
                        <span>Likes (#)</span>
                        <button class="like-button">♥</button>
                    </div>
                </div>

                <div class="posts-grid">
                    <div class="post-item">
                        Bird<br>Post 1
                    </div>
                    <div class="post-item">
                        Bird<br>Post 2
                    </div>
                    <div class="post-item">
                        Bird<br>Post 3
                    </div>
                    <div class="post-item">
                        Bird<br>Post 4
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
