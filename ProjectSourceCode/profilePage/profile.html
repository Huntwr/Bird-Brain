<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile • Bird-Brain</title>
  <link rel="stylesheet" href="profile.css" />
</head>
<body>
  <header class="profile-header">
    <div class="avatar-placeholder">Profile Picture Here</div>
    <div class="user-info">
      <h1 class="username">User Name Here</h1>
      <p class="description">Short user description goes here.</p>
    </div>
  </header>

  <main class="posts">
    <h2 class="section-title">User Posts</h2>

    <article class="post">
      <div class="post-placeholder">Bird Image 1 Here</div>
      <p class="caption">Bird 1 description goes here.</p>
    </article>

    <article class="post">
      <div class="post-placeholder">Bird Image 2 Here</div>
      <p class="caption">Bird 2 description goes here.</p>
    </article>
  </main>
</body>
</html>
